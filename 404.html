<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Capture the current path and search string
      const path = window.location.pathname;
      const search = window.location.search;
      
      // Store the requested URL in sessionStorage
      sessionStorage.setItem('redirectPath', path + search);
      
      // Redirect to the root index.html
      window.location.replace('/');
    </script>
  </head>
  <body>
  </body>
</html>
